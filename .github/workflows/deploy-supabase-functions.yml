name: Deploy Supabase Edge Functions

# Deploys the edge functions (and, if provided, configures their AI secret) to
# the ScoutTree Supabase project. Runs on pushes to main that touch the
# functions, or on demand via the "Run workflow" button.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token (sbp_...)
# Optional repository secret (unlocks the Find Player AI detective):
#   GEMINI_API_KEY         — Google Gemini API key (or use ANTHROPIC_API_KEY)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

env:
  PROJECT_REF: xqyszdjczchlgyisvtvo

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure AI secret (Gemini or Anthropic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$PROJECT_REF"
            echo "Set GEMINI_API_KEY."
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
            echo "Set ANTHROPIC_API_KEY."
          else
            echo "No AI key secret provided; functions deploy but AI detective stays in graceful-degradation mode."
          fi

      - name: Deploy edge functions
        run: |
          supabase functions deploy resolve-identity --project-ref "$PROJECT_REF"
          supabase functions deploy explain-move --project-ref "$PROJECT_REF"
          supabase functions deploy training-hint --project-ref "$PROJECT_REF"
