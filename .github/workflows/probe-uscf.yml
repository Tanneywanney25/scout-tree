name: Probe USCF (temporary)

# Temporary reconnaissance for the ratings-api.uschess.org JSON API.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover API routes from SPA bundle
        run: |
          set +e
          curl -sS -m 30 -A "Mozilla/5.0" "https://ratings.uschess.org/" -o idx.html
          JS=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' idx.html | head -1)
          echo "JS bundle: $JS"
          curl -sS -m 40 -A "Mozilla/5.0" "https://ratings.uschess.org${JS}" -o app.js
          echo "bundle size: $(wc -c < app.js)"
          echo "===== ratings-api base refs ====="
          grep -oE 'https://ratings-api\.uschess\.org[A-Za-z0-9/_.:{}$?=&-]*' app.js | sort -u | head -40
          echo "===== path-like string literals (players/tournaments/etc) ====="
          grep -oE '"/(players|player|tournaments|tournament|events|event|crosstable|members|member|ratings|search)[A-Za-z0-9/_.:{}?=&-]*"' app.js | sort -u | head -60
          echo "===== template paths with backticks/ids ====="
          grep -oE '`/(players|tournaments|events|members)[^`]{0,60}`' app.js | sort -u | head -40

      - name: Hit candidate API endpoints
        run: |
          set +e
          API="https://ratings-api.uschess.org"
          for u in \
            "$API/" "$API/docs" "$API/openapi.json" "$API/swagger.json" "$API/health" \
            "$API/players?name=Nakamura" \
            "$API/players/search?query=Nakamura" \
            "$API/players/search?name=Nakamura" \
            "$API/player/search?name=Nakamura" \
            "$API/v1/players?search=Nakamura" \
            "$API/players/12571843" \
            "$API/player/12571843" \
            "$API/players/12571843/tournaments" \
            "$API/players/12571843/ratings" ; do
            echo "===== $u ====="
            curl -sS -m 20 -A "Mozilla/5.0" -H "Accept: application/json" "$u" -w $'\nHTTP %{http_code} ct=%{content_type} size=%{size_download}\n' | head -c 900
            echo
          done
