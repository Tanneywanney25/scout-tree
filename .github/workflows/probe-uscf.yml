name: Probe USCF (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump structures
        run: |
          python3 - <<'PY'
          import urllib.request, re
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url):
              try: return urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=25).read().decode('latin-1','replace')
              except Exception as e: return f"ERR {e}"
          def flat(s): return re.sub(r'\s+',' ', s)

          # correct search needs rating=R
          s=get("https://www.uschess.org/datapage/player-search.php?name=Nakamura&rating=R&mode=Find")
          print("search rows:")
          for m in re.findall(r'MbrDtlMain\.php\?(\d{6,})[^>]*>([^<]*)</a>(?:[^<]*<[^>]*>){0,6}([^<]*)', s)[:8]:
              print(" ", m[0], flat(m[1])[:26], "|", flat(m[2])[:40])

          MID="12530928"
          h=get(f"https://www.uschess.org/msa/MbrDtlMain.php?{MID}")
          print(f"\n===== MbrDtlMain {MID} (size {len(h)}) =====")
          nm=re.search(r'<b>\s*'+MID+r':\s*([^<]+)</b>', h); print("name:", nm.group(1).strip() if nm else '?')
          i=h.find('Regular Rating')
          print("RATINGS REGION:\n", flat(h[max(0,i-80):i+1400]))
          for kw in ['Online','FIDE','State','Expir']:
              j=h.find(kw)
              if j>0: print(f"[{kw}]:", flat(h[j-10:j+120]))

          hh=get(f"https://www.uschess.org/msa/MbrDtlTnmtHst.php?{MID}")
          print(f"\n===== TnmtHst {MID} (size {len(hh)}) =====")
          # each event row: capture the Xtbl link + full row text
          rows=re.findall(r'(Xtbl\w+\.php\?[0-9A-Za-z.\-]+)[^>]*>([^<]*)</a>((?:(?!</tr>).){0,300})', hh)
          print("event rows:", len(rows))
          for r in rows[:8]:
              print("  LINK", r[0])
              print("   txt", flat(r[1])[:30], "||", flat(re.sub(r'<[^>]+>',' ',r[2]))[:150])
          # try an online event: look for a row whose text mentions online
          onlmatch=[r for r in rows if re.search(r'online', r[1]+r[2], re.I)]
          print("rows mentioning online:", len(onlmatch))
          ev = (onlmatch[0][0] if onlmatch else (rows[0][0] if rows else None))
          if ev:
              url="https://www.uschess.org/msa/"+ev
              x=get(url)
              print(f"\n===== CROSSTABLE {url} (size {len(x)}) =====")
              # header area (event name + rating system)
              hd=re.search(r'(Online|Regular|Quick|Blitz)[^<]{0,60}Rated', x, re.I)
              print("sys hint:", flat(hd.group(0)) if hd else "n/a")
              print("first 600 of body:", flat(re.sub(r'<[^>]+>',' ', x[x.find('<body'):x.find('<body')+1600])) if '<body' in x else flat(x[:600]))
              print("opponents:")
              for a in re.findall(r'MbrDtlMain\.php\?(\d{6,})[^>]*>\s*([^<]{0,40})', x)[:16]:
                  print("  ", a[0], flat(a[1])[:30])
          PY
