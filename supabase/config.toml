# ---------------------------------------------------------------------------
# Auth — optimized for instant, low-friction signup.
# Apply to the hosted project with `supabase config push` (or it syncs via the
# Supabase GitHub integration). These mirror the dashboard settings.
# ---------------------------------------------------------------------------
[auth]
site_url = "https://chess-scout.vercel.app"
additional_redirect_urls = [
  "https://chess-scout.vercel.app",
  "https://chess-scout.vercel.app/auth/callback",
  "http://localhost:8080",
  "http://localhost:8080/auth/callback",
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
# Instant accounts: no email verification, users are signed in immediately.
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false

# Google OAuth. The client id/secret are read from these env vars when pushing
# config; set them with `supabase secrets`/env, or keep Google configured in the
# dashboard (already done) and this block simply mirrors it.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.explain-move]
verify_jwt = false

[functions.training-hint]
verify_jwt = false

[functions.resolve-identity]
verify_jwt = false
region = "us-east-2"   