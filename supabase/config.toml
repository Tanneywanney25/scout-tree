# ---------------------------------------------------------------------------
# Auth — optimized for instant, low-friction signup.
# Apply to the hosted project with `supabase config push` (or it syncs via the
# Supabase GitHub integration). These mirror the dashboard settings.
# ---------------------------------------------------------------------------
[auth]
site_url = "https://chess-scout.vercel.app"
additional_redirect_urls = [
  "https://chess-scout.vercel.app",
  "https://chess-scout.vercel.app/auth/callback",
  "http://localhost:8080",
  "http://localhost:8080/auth/callback",
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
# Instant accounts: no email verification, users are signed in immediately.
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false

# Google OAuth — deliberately NOT declared here.
#
# The Google client id/secret live only in the hosted auth config: paste them in
# the dashboard (Authentication → Providers → Google) or set the repository
# secrets SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET, which the deploy
# workflow (.github/workflows/deploy-supabase-functions.yml) writes on every run
# and then verifies against the live authorize endpoint.
#
# This block used to read `client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"`.
# A config push from an environment without that variable sent the UNRESOLVED
# placeholder text to the project as the client id, so every "Continue with
# Google" ended at Google's "The OAuth client was not found" (401 invalid_client).
# Providers absent from this file are left untouched by `supabase config push`
# (the CLI only writes the providers it finds here), which is the safe state.

[functions.explain-move]
verify_jwt = false

[functions.training-hint]
verify_jwt = false

[functions.resolve-identity]
verify_jwt = false
region = "us-east-2"   